name: Build Surface Linux (qcom-x1e) Kernel Packages

on:
  push:
    branches:
      - '7.*'
      - 'main'
      - 'master'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with pre-built .deb packages'
        required: false
        type: boolean
        default: true

concurrency:
  group: build-qcom-x1e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build qcom-x1e Debian packages on Native ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Check out kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show runner environment details
        run: |
          echo "=== Runner Architecture & Kernel ==="
          uname -a
          lscpu
          echo "=== Memory & Disk Space ==="
          free -h
          df -h

      - name: Clean runner disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            bc \
            bindgen \
            bison \
            build-essential \
            clang-19 \
            cpio \
            curl \
            debhelper \
            default-jdk-headless \
            dkms \
            fakeroot \
            flex \
            gawk \
            git \
            java-common \
            kmod \
            libaudit-dev \
            libbpf-dev \
            libcap-dev \
            libdebuginfod-dev \
            libdw-dev \
            libelf-dev \
            libiberty-dev \
            liblzma-dev \
            libnewt-dev \
            libnl-3-dev \
            libnl-genl-3-dev \
            libnuma-dev \
            libpci-dev \
            libssl-dev \
            libstdc++-13-dev \
            libtool \
            libtraceevent-dev \
            libtracefs-dev \
            libudev-dev \
            libunwind-dev \
            linux-tools-common \
            llvm-19-dev \
            openssl \
            pahole \
            pkg-config \
            python3 \
            python3-dev \
            python3-setuptools \
            rsync \
            rust-src \
            rustc \
            rustfmt \
            systemd-ukify \
            uuid-dev \
            zstd

      - name: Prepare Ubuntu packaging metadata and config
        run: |
          export DEB_BUILD_OPTIONS="parallel=$(nproc)"
          chmod +x debian/rules
          fakeroot ./debian/rules clean
          ./debian/rules updateconfigs

      - name: Compile and package Linux qcom-x1e (.deb)
        run: |
          export DEB_BUILD_OPTIONS="parallel=$(nproc)"
          fakeroot ./debian/rules binary-qcom-x1e

      - name: Inspect generated Debian packages
        run: |
          echo "=== Generated Packages ==="
          ls -lh ../*.deb
          ls -lh ../*.changes || true

      - name: Upload Debian packages as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: surface-laptop-7-kernel-packages-arm64
          if-no-files-found: error
          path: |
            ../*.deb
            ../*.changes
            ../*.buildinfo

      - name: Create GitHub Release on Tag or Dispatch
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          name: "Surface Laptop 7 Kernel ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## Surface Laptop 7 (Snapdragon X Elite) Ubuntu Kernel Release
            
            Custom kernel rebased on the latest `linux-qcom-x1e` tree with full hardware enablement for the **Surface Laptop 7 (13.8")**:
            - **Touchpad**: HIDSPI v3 over QSPI (`spi-hid`, GPI DMA protocol 9, GENI SPI 1-4-4).
            - **Webcam**: Native sensor crop and frame configuration (`ov02c10`).
            - **Display**: Retimer idle power-management (`ps883x`).
            - **Wi-Fi 7**: Reliable enumeration workaround (`ath12k`).
            - **Power & EC**: Surface System Aggregator Module (SSAM) and battery telemetry.
            
            ### Installation on Ubuntu
            ```bash
            sudo dpkg -i linux-image-*.deb linux-modules-*.deb linux-headers-*.deb
            sudo update-grub
            sudo reboot
            ```
          files: |
            ../*.deb
