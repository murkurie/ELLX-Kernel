name: Build Surface Linux (qcom-x1e) Kernel Packages

on:
  push:
    branches:
      - '7.*'
      - 'main'
      - 'master'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with pre-built .deb packages'
        required: false
        type: boolean
        default: true

concurrency:
  group: build-qcom-x1e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build qcom-x1e Debian packages on Native ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Check out patch repository
        uses: actions/checkout@v4
        with:
          path: ellx-patches

      - name: Show runner environment details
        run: |
          echo "=== Runner Architecture & Kernel ==="
          uname -a
          lscpu
          echo "=== Memory & Disk Space ==="
          free -h
          df -h

      - name: Clean runner disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            bc \
            bindgen \
            bison \
            build-essential \
            clang-19 \
            cpio \
            curl \
            debhelper \
            default-jdk-headless \
            dkms \
            dwarves \
            fakeroot \
            flex \
            gawk \
            git \
            java-common \
            kmod \
            libaudit-dev \
            libbpf-dev \
            libcap-dev \
            libdebuginfod-dev \
            libdw-dev \
            libelf-dev \
            libiberty-dev \
            liblzma-dev \
            libnewt-dev \
            libnl-3-dev \
            libnl-genl-3-dev \
            libnuma-dev \
            libpci-dev \
            libssl-dev \
            libstdc++-13-dev \
            libtool \
            libtraceevent-dev \
            libtracefs-dev \
            libudev-dev \
            libunwind-dev \
            linux-tools-common \
            llvm-19-dev \
            openssl \
            pahole \
            pkg-config \
            python3 \
            python3-dev \
            python3-setuptools \
            rsync \
            rust-src \
            rustc \
            rustfmt \
            systemd-ukify \
            uuid-dev \
            zstd

      - name: Clone upstream linux-qcom-x1e (7.2 resolute)
        run: |
          echo "=== Cloning latest linux-qcom-x1e tree ==="
          git clone --depth 1 --branch x1e80100-book4e-7.2-14-tmp https://github.com/zensanp/linux-book4-edge.git kernel
          cd kernel
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Apply Surface Laptop 7 patch series
        working-directory: kernel
        run: |
          PATCH_DIR="${{ github.workspace }}/ellx-patches/patches"
          echo "=== Applying Surface Linux patches from ${PATCH_DIR} ==="
          while IFS= read -r patch || [ -n "$patch" ]; do
            [[ "$patch" =~ ^#.*$ ]] && continue
            [[ -z "$patch" ]] && continue

            echo "--> Applying ${patch}..."
            git apply --verbose --whitespace=nowarn "${PATCH_DIR}/${patch}"
            git add -A
            git commit -m "Apply ${patch}"
          done < "${PATCH_DIR}/series"
          echo "All patches applied successfully."

      - name: Prepare packaging environment
        working-directory: kernel
        run: |
          # Map gcc-15 references to system GCC on Ubuntu 24.04
          for tool in gcc g++ cpp gcov; do
            if which $tool >/dev/null 2>&1; then
              sudo ln -sf $(which $tool) /usr/bin/aarch64-linux-gnu-${tool}-15
              sudo ln -sf $(which $tool) /usr/bin/${tool}-15
            fi
          done
          aarch64-linux-gnu-gcc-15 --version

          sed -i 's/gcc:=gcc-15/gcc:=gcc/' debian/rules.d/0-common-vars.mk || true
          sed -i 's/do_stubble\s*=\s*true/do_stubble = false/' debian.qcom-x1e/rules.d/arm64.mk || true
          chmod +x debian/rules
          fakeroot ./debian/rules clean

      - name: Compile and package Linux qcom-x1e (.deb)
        working-directory: kernel
        run: |
          export DEB_BUILD_OPTIONS="parallel=$(nproc)"
          fakeroot ./debian/rules binary-headers binary-qcom-x1e do_skip_checks=true do_stubble=false

      - name: Inspect generated Debian packages
        run: |
          echo "=== Inspecting Generated Packages ==="
          mkdir -p artifacts
          cp -v *.deb artifacts/ 2>/dev/null || true
          cp -v kernel/*.deb artifacts/ 2>/dev/null || true
          cp -v *.changes artifacts/ 2>/dev/null || true
          cp -v *.buildinfo artifacts/ 2>/dev/null || true
          find kernel/debian/build/ -name "x1e80100-microsoft-romulus*.dtb" -exec cp -v {} artifacts/ \; 2>/dev/null || true
          ls -lh artifacts/

      - name: Upload Debian packages as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: surface-laptop-7-kernel-packages-arm64
          if-no-files-found: error
          path: artifacts/*

      - name: Create GitHub Release on Tag or Dispatch
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          name: "Surface Laptop 7 Kernel ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## Surface Laptop 7 (Snapdragon X Elite) Ubuntu Kernel Release
            
            Custom kernel rebased on the latest `linux-qcom-x1e` tree (Linux 7.2) with full hardware enablement for the **Surface Laptop 7 (13.8")**:
            - **Touchpad**: HIDSPI v3 over QSPI (`spi-hid`, GPI DMA protocol 9, GENI SPI 1-4-4).
            - **Webcam**: Native sensor crop and frame configuration (`ov02c10`).
            - **Display**: Retimer idle power-management (`ps883x`).
            - **Wi-Fi 7**: Reliable enumeration workaround (`ath12k`).
            - **Power & EC**: Surface System Aggregator Module (SSAM) and battery telemetry.
            
            ### Installation on Ubuntu
            ```bash
            sudo dpkg -i linux-image-*.deb linux-modules-*.deb linux-headers-*.deb
            sudo update-grub
            sudo reboot
            ```
          files: artifacts/*
